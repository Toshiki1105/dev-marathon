<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRMシステム トップ + 顧客一覧</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">

    <!-- トップページリンク -->
    <div class="mb-3 text-center">
      <h1 class="mb-4">CRMシステム</h1>
      <p class="lead">以下のリンクから管理画面に移動できます。</p>
      <a href="./list.html" class="btn btn-primary btn-lg">👥 顧客一覧へ</a>
      <a href="./add.html" class="btn btn-success btn-lg ml-3">➕ 顧客登録へ</a>
      <a href="../case/list.html" class="btn btn-info btn-lg ml-3">📋 案件一覧へ</a>
      <a href="../negotiation/list.html" class="btn btn-secondary btn-lg ml-3">💼 商談一覧へ</a>
    </div>

    <!-- 顧客一覧テーブル -->
    <h2 class="mb-4">顧客一覧</h2>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>ID</th>
          <th>会社名</th>
          <th>業種</th>
          <th>連絡先</th>
          <th>所在地</th>
          <th>登録日時</th>
          <th>操作</th> 
        </tr>
      </thead>
      <tbody id="customer-list"></tbody>
    </table>

  </div>

  <script type="module">
    import config from "../config.js";

    async function loadCustomers() {
      const response = await fetch(config.apiUrl + "/customers");
      const data = await response.json();
      const tableBody = document.getElementById("customer-list");
      tableBody.innerHTML = "";

      data.forEach(customer => {
        const row = `
          <tr>
            <td>${customer.id}</td>
            <td><a href="detail.html?id=${customer.id}">${customer.company_name}</a></td>
            <td>${customer.industry}</td>
            <td>${customer.contact}</td>
            <td>${customer.location}</td>
            <td>${new Date(customer.created_at).toLocaleString()}</td>
            <td>
              <button class="btn btn-danger btn-sm delete-btn" data-id="${customer.id}">削除</button>
              <a href="update.html?id=${customer.id}" class="btn btn-warning btn-sm ml-2">編集</a>
            </td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });

      document.querySelectorAll(".delete-btn").forEach(button => {
        button.addEventListener("click", async (e) => {
          const id = e.target.dataset.id;
          if (!confirm("削除していいですか？")) return;
          const res = await fetch(`${config.apiUrl}/customers/${id}`, { method: "DELETE" });
          const result = await res.json();
          if (result.success) {
            alert("削除しました。");
            loadCustomers();
          } else {
            alert("削除に失敗しました。");
          }
        });
      });
    }

    loadCustomers();
  </script>
</body>
</html>
